name: Update SL List

on:
  schedule:
    - cron: "0 0 * * *"  # weekly on Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
        
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the script
        run:  python scripts/sl_list.py
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          DOCUMENT_ID: ${{ secrets.DOCUMENT_ID }}

      - name: Commit changes
        run: |
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add resources/
            git commit -m "Weekly SL list update" || echo "No changes"
            git push