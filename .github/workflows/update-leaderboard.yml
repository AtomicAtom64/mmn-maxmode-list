name: Update Leaderboard And Beaten Modes List

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:  

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
        
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the leaderboard script
        run:  python scripts/leaderboard.py

      - name: Run the countries script
        run:  python scripts/countries.py

      - name: Run the beaten modes script
        run:  python scripts/beatenmodes.py

      - name: Show diff
        run: |
          git status
          git diff

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add resources
          git commit -m "Update leaderboard" || echo "No changes"
          git push