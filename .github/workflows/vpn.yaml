name: Test with Cloudflare WARP

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  warp_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cloudflare WARP
        id: warp-install
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg |
            sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl enable --now warp-svc

      - name: Connect to WARP
        run: |
          warp-cli registration new
          warp-cli connect

          for attempt in {1..30}; do
            trace="$(curl -fsS https://www.cloudflare.com/cdn-cgi/trace)" || {
              sleep 2
              continue
            }
            if grep -qx 'warp=on' <<< "$trace"; then
              echo "Cloudflare WARP is connected."
              exit 0
            fi
            sleep 2
          done

          echo "Cloudflare WARP did not connect within 60 seconds." >&2
          warp-cli status
          exit 1

      - name: Verify WARP exit IP and run test
        run: |
          echo "Observed public IP and country:"
          curl -fsS https://ipapi.co/json/
          echo
          echo "Calling the authorized test endpoint:"
          curl -fsS --max-time 30 -o /dev/null -w "HTTP %{http_code}\n" \
            https://aml-api-eta.vercel.app/

      - name: Disconnect WARP
        if: always() && steps.warp-install.outcome == 'success'
        run: warp-cli disconnect
