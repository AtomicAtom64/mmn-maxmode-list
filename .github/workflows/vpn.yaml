name: Test with VPN Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vpn_gate_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine OpenVPN package version
        id: openvpn-version
        run: |
          sudo apt-get update
          version="$(apt-cache policy openvpn | awk '/Candidate:/ {print $2}')"
          if [[ -z "$version" || "$version" == "(none)" ]]; then
            echo "Could not determine the OpenVPN package version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache OpenVPN installation packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ runner.os }}-${{ runner.arch }}-apt-openvpn-${{ steps.openvpn-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-apt-openvpn-

      - name: Install OpenVPN
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          sudo apt-get -o "Dir::Cache::archives=$RUNNER_TEMP/apt-archives" install -y openvpn

      - name: Select and validate VPN Gate relays
        run: |
          python3 - <<'PY'
          import base64
          import csv
          import io
          import ipaddress
          import os
          import re
          import urllib.request

          url = "https://www.vpngate.net/api/iphone/"
          request = urllib.request.Request(url, headers={"User-Agent": "GitHub-Actions-VPN-Gate-Test"})
          with urllib.request.urlopen(request, timeout=30) as response:
              content = response.read(10_000_001)
          if len(content) > 10_000_000:
              raise SystemExit("VPN Gate relay list exceeded the 10 MB safety limit.")

          rows = csv.reader(io.StringIO(content.decode("utf-8", "replace")))
          marker = next(rows, [])
          headers = next(rows, [])
          if marker != ["*vpn_servers"] or not headers:
              raise SystemExit("VPN Gate returned an unexpected relay-list format.")
          headers[0] = headers[0].lstrip("#")
          records = [dict(zip(headers, row)) for row in rows if len(row) == len(headers)]

          allowed_directives = {
              "dev", "proto", "remote", "cipher", "data-ciphers", "auth",
              "resolv-retry", "nobind", "persist-key", "persist-tun", "client", "verb",
          }

          def validated_config(record):
              relay_ip = ipaddress.ip_address(record["IP"])
              if not isinstance(relay_ip, ipaddress.IPv4Address) or not relay_ip.is_global:
                  raise ValueError("not a public IPv4 relay")

              encoded = record["OpenVPN_ConfigData_Base64"]
              config = base64.b64decode(encoded, validate=True).decode("utf-8")
              if len(config) > 200_000:
                  raise ValueError("configuration is too large")

              blocks = {}
              directives = []
              active_block = None
              block_lines = []
              for raw_line in config.splitlines():
                  line = raw_line.strip()
                  if active_block:
                      if line == f"</{active_block}>":
                          blocks[active_block] = block_lines
                          active_block = None
                          block_lines = []
                      elif line:
                          block_lines.append(line)
                      continue
                  if not line or line.startswith(("#", ";")):
                      continue
                  if line.startswith("<"):
                      match = re.fullmatch(r"<(ca|cert|key)>", line)
                      if not match or match.group(1) in blocks:
                          raise ValueError("unexpected inline configuration block")
                      active_block = match.group(1)
                      continue
                  parts = line.split()
                  if parts[0] not in allowed_directives:
                      raise ValueError(f"unsupported directive: {parts[0]}")
                  directives.append(parts)

              if active_block or set(blocks) != {"ca", "cert", "key"}:
                  raise ValueError("missing or incomplete certificate material")

              remote = [parts for parts in directives if parts[0] == "remote"]
              proto = [parts for parts in directives if parts[0] == "proto"]
              device = [parts for parts in directives if parts[0] == "dev"]
              if len(remote) != 1 or len(remote[0]) != 3 or remote[0][1] != str(relay_ip):
                  raise ValueError("relay address did not match the official list")
              if not re.fullmatch(r"[0-9]{1,5}", remote[0][2]) or not 1 <= int(remote[0][2]) <= 65535:
                  raise ValueError("invalid relay port")
              if len(proto) != 1 or len(proto[0]) != 2 or proto[0][1] not in {"tcp", "udp"}:
                  raise ValueError("unsupported transport")
              if device != [["dev", "tun"]]:
                  raise ValueError("unsupported tunnel device")

              for tag, begin, end in (
                  ("ca", "-----BEGIN CERTIFICATE-----", "-----END CERTIFICATE-----"),
                  ("cert", "-----BEGIN CERTIFICATE-----", "-----END CERTIFICATE-----"),
              ):
                  material = blocks[tag]
                  if not material or material[0] != begin or material[-1] != end:
                      raise ValueError(f"invalid {tag} PEM block")
                  if any(not re.fullmatch(r"[A-Za-z0-9+/=.-]+", line) for line in material[1:-1]):
                      raise ValueError(f"invalid characters in {tag} PEM block")

              key_material = blocks["key"]
              key_headers = {
                  "-----BEGIN PRIVATE KEY-----": "-----END PRIVATE KEY-----",
                  "-----BEGIN RSA PRIVATE KEY-----": "-----END RSA PRIVATE KEY-----",
                  "-----BEGIN EC PRIVATE KEY-----": "-----END EC PRIVATE KEY-----",
              }
              if not key_material or key_headers.get(key_material[0]) != key_material[-1]:
                  raise ValueError("invalid private key PEM block")
              if any(not re.fullmatch(r"[A-Za-z0-9+/=.-]+", line) for line in key_material[1:-1]):
                  raise ValueError("invalid characters in private key PEM block")

              def option(name, default):
                  values = [parts[1] for parts in directives if parts[0] == name]
                  if len(values) > 1:
                      raise ValueError(f"duplicate {name} option")
                  value = values[0] if values else default
                  if not re.fullmatch(r"[A-Za-z0-9_-]+", value):
                      raise ValueError(f"invalid {name} option")
                  return value

              lines = [
                  "client", "dev tun", f"proto {proto[0][1]}",
                  f"remote {relay_ip} {remote[0][2]}",
                  "resolv-retry infinite", "nobind", "persist-key", "persist-tun",
                  "remote-cert-tls server", "route-nopull", "redirect-gateway def1",
                  f"cipher {option('cipher', 'AES-128-CBC')}",
                  f"data-ciphers {option('data-ciphers', 'AES-128-CBC')}",
                  f"auth {option('auth', 'SHA1')}", "verb 3",
              ]
              for tag in ("ca", "cert", "key"):
                  lines.extend([f"<{tag}>", *blocks[tag], f"</{tag}>"])
              return "\n".join(lines) + "\n"

          candidates = []
          for record in records:
              try:
                  score = int(record.get("Score", "0"))
                  speed = int(record.get("Speed", "0"))
              except ValueError:
                  continue
              if score > 0 and record.get("OpenVPN_ConfigData_Base64"):
                  candidates.append((score, speed, record))
          candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)

          selected = 0
          for _, _, record in candidates:
              try:
                  config = validated_config(record)
              except (KeyError, ValueError, UnicodeDecodeError) as error:
                  print(f"Skipping invalid VPN Gate relay: {error}")
                  continue
              selected += 1
              path = os.path.join(os.environ["RUNNER_TEMP"], f"vpngate-{selected}.ovpn")
              with open(path, "w", encoding="utf-8") as output:
                  output.write(config)
              os.chmod(path, 0o600)
              print(f"Selected relay candidate {selected}: {record['CountryLong']} ({record['IP']})")
              if selected == 3:
                  break

          if not selected:
              raise SystemExit("VPN Gate did not provide any valid OpenVPN relay configurations.")
          PY

      - name: Connect to VPN Gate
        id: vpn-connect
        run: |
          baseline="$(curl -fsS --connect-timeout 10 --max-time 15 https://www.cloudflare.com/cdn-cgi/trace |
            awk -F= '$1 == "ip" {print $2}')"
          if [[ -z "$baseline" ]]; then
            echo "Could not determine the runner's baseline public IP." >&2
            exit 1
          fi
          echo "Runner baseline IP: $baseline"

          for index in 1 2 3; do
            config="$RUNNER_TEMP/vpngate-${index}.ovpn"
            [[ -f "$config" ]] || continue
            pidfile="$RUNNER_TEMP/vpngate-openvpn.pid"
            logfile="$RUNNER_TEMP/vpngate-openvpn.log"

            echo "Trying VPN Gate relay candidate $index..."
            if ! sudo openvpn --config "$config" --daemon --writepid "$pidfile" --log "$logfile"; then
              echo "OpenVPN could not start relay candidate $index."
              sudo tail -n 20 "$logfile" || true
              continue
            fi

            for attempt in {1..30}; do
              exit_ip="$(curl -fsS --connect-timeout 5 --max-time 10 \
                https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null |
                awk -F= '$1 == "ip" {print $2}' || true)"
              if [[ -n "$exit_ip" && "$exit_ip" != "$baseline" ]]; then
                echo "VPN Gate tunnel is active; observed exit IP: $exit_ip"
                echo "connected=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [[ -f "$pidfile" ]] && ! sudo kill -0 "$(sudo cat "$pidfile")" 2>/dev/null; then
                break
              fi
              sleep 2
            done

            if [[ -f "$pidfile" ]]; then
              sudo kill "$(sudo cat "$pidfile")" 2>/dev/null || true
              rm -f "$pidfile"
            fi
            echo "Relay candidate $index did not establish a tunnel."
            sudo tail -n 20 "$logfile" || true
          done

          echo "No VPN Gate relay candidate connected successfully." >&2
          exit 1

      - name: Call the test endpoint through VPN Gate
        if: steps.vpn-connect.outputs.connected == 'true'
        run: |
          echo "Calling the authorized test endpoint:"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
            --max-time 30 -o /dev/null -w "HTTP %{http_code}\n" \
            https://aml-api-eta.vercel.app/

      - name: Disconnect and clean up
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/vpngate-openvpn.pid" ]]; then
            pid="$(sudo cat "$RUNNER_TEMP/vpngate-openvpn.pid")"
            if sudo kill "$pid" 2>/dev/null; then
              echo "Stopped OpenVPN process $pid."
            else
              echo "OpenVPN process $pid was already stopped."
            fi
          fi
          rm -f "$RUNNER_TEMP/vpngate-openvpn.pid" \
            "$RUNNER_TEMP/vpngate-openvpn.log" \
            "$RUNNER_TEMP/vpngate-1.ovpn" \
            "$RUNNER_TEMP/vpngate-2.ovpn" \
            "$RUNNER_TEMP/vpngate-3.ovpn"
